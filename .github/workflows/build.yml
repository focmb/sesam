name: Build

# Baut Sesam bei jedem Tag "v*" (z. B. v1.2.2) und auf Knopfdruck
# (GitHub: Actions -> Build -> "Run workflow"). Bei einem Tag entsteht zusätzlich ein Release
# mit den fertigen Dateien. Es werden GitHub-Runner benutzt, eigene Runner sind nicht nötig.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  linux:
    # Ubuntu 22.04 = glibc 2.35: das Programm läuft auf allen neueren Linux-Distributionen.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Systembibliotheken für Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller pytest

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Programm bauen (tar.gz)
        run: python packaging/build.py

      - name: Debian-Paket bauen
        run: python packaging/build_deb.py

      - uses: actions/upload-artifact@v7
        with:
          name: sesam-linux
          path: |
            dist/*.tar.gz
            dist/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: python -m pip install -e . pyinstaller pytest

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Programm bauen (zip mit sesam.exe)
        run: python packaging/build.py

      - uses: actions/upload-artifact@v7
        with:
          name: sesam-windows
          path: dist/*.zip

  release:
    # Nur bei einem Tag: Dateien einsammeln, Prüfsummen erzeugen, Release anlegen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true

      - name: Prüfsummen
        run: |
          cd files
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: files/*
          generate_release_notes: true
