[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sesam"
version = "1.6.1"
description = "SSH-Verbindungen verwalten und in frei konfigurierbaren Terminals öffnen"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PySide6>=6.6", "keyring>=24", "cryptography>=42", "paramiko>=3.4"]

[project.gui-scripts]
sesam = "sesam.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
