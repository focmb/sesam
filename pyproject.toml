[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-verwaltung"
version = "0.1.0"
description = "SSH-Verbindungen verwalten und in frei konfigurierbaren Terminals öffnen"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "keyring>=24"]

[project.gui-scripts]
ssh-verwaltung = "ssh_verwaltung.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
